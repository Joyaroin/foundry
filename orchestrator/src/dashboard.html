<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>foundry — run</title>
<style>
  :root{
    --ground:#070809;
    --panel:#0d0f12;
    --panel-2:#111419;
    --hair:rgba(255,255,255,.07);
    --hair-strong:rgba(255,255,255,.13);
    --text:#eceae4;
    --dim:#7d838d;
    --dimmer:#565b64;

    --live:#ffb454;
    --land:#8ab4ff;
    --ok:#5fe3a1;
    --bad:#ff6b6b;

    --r:14px;
    --ease:cubic-bezier(.16,1,.3,1);
    --spring:linear(0,.045,.16,.31,.47,.62,.75,.85,.92,.97,1.004,1.021,1.027,1.026,1.021,1.015,1.009,1.004,1.001,1);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--text);
    font:400 14px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* The ground is not flat black: a slow wash behind the header gives the page a light
     source, which is what stops a dark UI reading as an absence of design. */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 380px at 22% -6%, rgba(255,180,84,.10), transparent 62%),
      radial-gradient(760px 340px at 82% -4%, rgba(138,180,255,.075), transparent 60%);
  }
  /* Grain. Two thousandths of an alpha, and it is the difference between a surface and
     a fill. */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  .shell{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:22px 26px 0;gap:18px}

  /* ── HUD ───────────────────────────────────────────────────────────── */
  .hud{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:14px}
  .mark{
    font:300 21px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.42em;
    text-transform:uppercase;color:var(--text);padding-right:.1em;
  }
  .ident{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:var(--dim);letter-spacing:.02em}
  .ident b{color:var(--text);font-weight:500}
  .ident .sep{color:var(--dimmer);padding:0 8px}

  .status{display:flex;align-items:center;gap:22px}
  .pulse{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .dot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--dimmer);flex:none}
  .dot.on{background:var(--live);box-shadow:0 0 14px rgba(255,180,84,.75)}
  .dot.on::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1px solid rgba(255,180,84,.5);animation:ring 2.2s var(--ease) infinite;
  }
  .dot.done{background:var(--ok);box-shadow:0 0 14px rgba(95,227,161,.6)}
  .dot.fail{background:var(--bad);box-shadow:0 0 14px rgba(255,107,107,.6)}
  @keyframes ring{0%{transform:scale(.7);opacity:.9}70%{transform:scale(1.9);opacity:0}100%{opacity:0}}

  .clock{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:200;letter-spacing:.02em}

  /* ── Tallies ───────────────────────────────────────────────────────── */
  .tallies{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
  .tally{background:var(--panel);padding:13px 16px 14px}
  .tally .k{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--dimmer)}
  .tally .v{margin-top:5px;font:200 30px/1 ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .tally.live .v{color:var(--live)}
  .tally.ok   .v{color:var(--ok)}
  .tally.bad  .v{color:var(--bad)}
  .tally .v.zero{color:var(--dimmer)}

  /* ── Body ──────────────────────────────────────────────────────────── */
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr);gap:18px;padding-bottom:22px}
  .col{min-height:0;display:flex;flex-direction:column;gap:11px}
  .colhead{display:flex;align-items:baseline;justify-content:space-between;font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--dimmer)}
  .scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--hair-strong) transparent}
  .scroll::-webkit-scrollbar{width:7px}
  .scroll::-webkit-scrollbar-thumb{background:var(--hair-strong);border-radius:99px}

  /* ── Builder card ──────────────────────────────────────────────────── */
  .cards{display:flex;flex-direction:column;gap:11px;padding-right:4px}
  .card{
    position:relative;overflow:hidden;
    border:1px solid var(--hair);border-radius:var(--r);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    padding:14px 16px 15px;
  }
  /* One-shot: on the base class this replayed on every class-list write, which at a 1Hz
     render is a flicker rather than an entrance. The class is removed when it finishes. */
  .card.enter{animation:enter .5s var(--spring) both}
  @keyframes enter{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}

  /* A working card is lit from its left edge, and the light travels. Nothing else on the
     page moves on its own, so this is unambiguous: motion means a builder is running. */
  .card.working::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,transparent,var(--live),transparent);
    background-size:100% 220%;animation:travel 2.6s linear infinite;
  }
  @keyframes travel{from{background-position:0 -110%}to{background-position:0 110%}}
  .card.landing::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--land);opacity:.85}
  .card.closed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ok);opacity:.7}
  .card.failed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--bad)}
  .card.closed{opacity:.78}

  .row1{display:flex;align-items:center;gap:12px}
  .num{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:500;letter-spacing:.01em;color:var(--dim);flex:none}
  .card.working .num{color:var(--live)}
  .card.landing .num{color:var(--land)}
  .card.closed  .num{color:var(--ok)}
  .card.failed  .num{color:var(--bad)}
  .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--text)}
  .card.closed .title{color:var(--dim)}
  .chip{
    flex:none;font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
    padding:4px 8px;border-radius:99px;border:1px solid var(--hair-strong);color:var(--dim);
  }
  .card.working .chip{color:var(--live);border-color:rgba(255,180,84,.34);background:rgba(255,180,84,.07)}
  .card.landing .chip{color:var(--land);border-color:rgba(138,180,255,.34);background:rgba(138,180,255,.07)}
  .card.closed  .chip{color:var(--ok);border-color:rgba(95,227,161,.3);background:rgba(95,227,161,.06)}
  .card.failed  .chip{color:var(--bad);border-color:rgba(255,107,107,.36);background:rgba(255,107,107,.08)}
  .elapsed{flex:none;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--dim);min-width:52px;text-align:right}

  .say{
    margin-top:9px;font-size:12.5px;color:var(--dim);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.45em;
  }
  .say em{font-style:normal;color:var(--dimmer)}

  .phases{margin-top:11px;display:flex;align-items:center;gap:5px}
  .ph{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
  .ph.done{background:var(--hair-strong)}
  .ph.done.ok{background:rgba(95,227,161,.5)}
  .ph.now::after{content:"";position:absolute;inset:0;background:var(--live);animation:fill 1.4s var(--ease) infinite alternate;transform-origin:left}
  @keyframes fill{from{transform:scaleX(.12);opacity:.55}to{transform:scaleX(1);opacity:1}}
  .ph.now.land::after{background:var(--land)}
  .phlabels{margin-top:6px;display:flex;gap:5px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer)}
  .phlabels span{flex:1}

  /* ── Stream ────────────────────────────────────────────────────────── */
  .stream{
    border:1px solid var(--hair);border-radius:var(--r);background:var(--panel);
    padding:10px 4px 10px 12px;flex:1;min-height:0;display:flex;flex-direction:column;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 22px,#000 calc(100% - 8px),transparent);
            mask-image:linear-gradient(180deg,transparent,#000 22px,#000 calc(100% - 8px),transparent);
  }
  .lines{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;line-height:1.72;padding-right:10px}
  .ln{display:flex;gap:9px;animation:slide .34s var(--ease) both}
  @keyframes slide{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
  .ln .t{color:#3f444c;flex:none;font-variant-numeric:tabular-nums}
  .ln .b{flex:none;width:34px;color:var(--dimmer)}
  .ln .m{flex:1;min-width:0;color:var(--dim);word-break:break-word}
  .ln.say .m{color:#aeb3bb}
  .ln.evt .m{color:var(--text)}
  .ln.gate .m{color:var(--land)}
  .ln.ok   .m{color:var(--ok)}
  .ln.bad  .m{color:var(--bad)}
  .ln.round{margin-top:9px}
  .ln.round .m{color:var(--text);letter-spacing:.08em;text-transform:uppercase;font-size:10px}

  /* ── Outcome ───────────────────────────────────────────────────────── */
  .outcome{
    border:1px solid var(--hair-strong);border-radius:var(--r);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    padding:16px 18px;margin-bottom:22px;display:none;
    animation:enter .6s var(--spring) both;
  }
  .outcome.show{display:block}
  .outcome h2{margin:0 0 3px;font:300 19px/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.01em}
  .outcome.good h2{color:var(--ok)}
  .outcome.poor h2{color:var(--live)}
  .outcome p{margin:0;font-size:12.5px;color:var(--dim)}
  .outcome .pr{margin-top:9px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim)}
  .outcome .pr b{color:var(--text);font-weight:500}

  .empty{color:var(--dimmer);font-size:13px;padding:26px 2px;line-height:1.6}
  .empty code{font-family:ui-monospace,Menlo,monospace;color:var(--dim)}

  @media (max-width:1080px){
    .grid{grid-template-columns:1fr;grid-template-rows:minmax(0,1.3fr) minmax(0,1fr)}
    .tallies{grid-template-columns:repeat(3,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="hud">
    <div class="brand">
      <div class="mark">foundry</div>
      <div class="ident" id="ident">waiting for a run</div>
    </div>
    <div class="status">
      <div class="pulse"><span class="dot" id="dot"></span><span id="phase">idle</span></div>
      <div class="clock" id="clock">--:--</div>
    </div>
  </header>

  <section class="tallies">
    <div class="tally"><div class="k">round</div><div class="v zero" id="t-round">0</div></div>
    <div class="tally live"><div class="k">in flight</div><div class="v zero" id="t-flight">0</div></div>
    <div class="tally ok"><div class="k">closed</div><div class="v zero" id="t-closed">0</div></div>
    <div class="tally bad"><div class="k">handed back</div><div class="v zero" id="t-back">0</div></div>
    <div class="tally"><div class="k">tickets</div><div class="v zero" id="t-total">0</div></div>
  </section>

  <main class="grid">
    <div class="col">
      <div class="colhead"><span>builders</span><span id="cap"></span></div>
      <div class="scroll"><div class="cards" id="cards">
        <div class="empty" id="empty">No run in this log yet.<br />Start one with <code>foundry run &lt;spec&gt;</code> — this page follows it.</div>
      </div></div>
    </div>
    <div class="col">
      <div class="colhead"><span>stream</span></div>
      <div class="stream"><div class="scroll" id="streamScroll"><div class="lines" id="lines"></div></div></div>
    </div>
  </main>

  <div class="outcome" id="outcome"></div>
</div>

<script>
/* ── The state machine ───────────────────────────────────────────────────
   Every rule about what a log line means lives here and nowhere else. The
   server tails a file; this decides what the file says. */

const PHASES = ["worktree", "setup", "build", "merge", "gate", "done"];

const state = {
  repo:null, spec:null, base:null, auth:null,
  round:0, cap:null, ready:null,
  tickets:new Map(),      // number -> ticket
  order:[],
  closed:0, back:0, total:0,
  pr:null, prVerb:null, merged:null, stop:null,
  started:null, last:null, finished:false,
};

const $ = (id) => document.getElementById(id);

/* Log timestamps are wall-clock HH:MM:SS. Anchored to today so elapsed times can tick
   against the real clock while the run is live, and freeze at the last line once it is
   not — a finished run must not keep counting. */
function at(hms){
  const [h,m,s] = hms.split(":").map(Number);
  const d = new Date();
  d.setHours(h,m,s,0);
  return d.getTime();
}
function dur(ms){
  if (ms == null || ms < 0) return "";
  const s = Math.floor(ms/1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s/60);
  if (m < 60) return m + "m" + String(s%60).padStart(2,"0") + "s";
  return Math.floor(m/60) + "h" + String(m%60).padStart(2,"0") + "m";
}
/* A branch slug is the only place a ticket's title survives into the log, so it is read
   back out rather than left as a number: `foundry/284-the-surface-settles-toward` is a
   title with its spaces removed, and putting them back costs nothing. */
function titleFromBranch(branch){
  const tail = String(branch).replace(/^foundry\//,"").replace(/^\d+-/,"");
  if (!tail) return "";
  const words = tail.split("-").filter(Boolean).join(" ");
  return words.charAt(0).toUpperCase() + words.slice(1);
}

function ticket(n){
  let t = state.tickets.get(n);
  if (!t){
    t = { n, title:"", branch:"", phase:null, chip:"queued", say:"", start:null, end:null,
          builderEnd:null, waiting:false, took:null,
          result:null, gate:null, gates:[], setups:[] };
    state.tickets.set(n, t);
    state.order.push(n);
  }
  return t;
}

const RE = {
  head:   /^foundry: (.+), spec #(\d+), base (.+)$/,
  auth:   /^auth\s*: (.+)$/,
  wrote:  /^wrote (\d+) tickets?: (.+)$/,
  round:  /^round (\d+): building (.+) \((\d+) ready, cap (\d+)\)$/,
  title:  /^ {2}#(\d+) title: (.+)$/,
  wt:     /^ {2}#(\d+) worktree cut from (.+)$/,
  setup:  /^ {2}#(\d+) setup: (.+)$/,
  start:  /^ {2}#(\d+) builder started on (.+)$/,
  say:    /^ {2}#(\d+) \| (.*)$/,
  fin:    /^ {2}#(\d+) builder finished in (\S+) \((.*)\)$/,
  teard:  /^ {2}#(\d+) teardown(?: failed \(not fatal\))?: (.+)$/,
  merge:  /^ {2}#(\d+) merging (.+)$/,
  confl:  /^ {2}#(\d+) merge conflict resolved \((.*)\)$/,
  gate:   /^ {2}#(\d+) gate: (.+)$/,
  closed: /^ {2}#(\d+) closed$/,
  back:   /^ {2}#(\d+) handed back: (.*)$/,
  pr:     /^(opened|updated) PR #(\d+)/,
  merged: /^merged PR #(\d+)$/,
  summary:/^(stop condition|closed|handed back|still blocked|pull request|merged)\s*: (.+)$/,
  blocked:/^ {2}blocked #(\d+): (.+)$/,
};

function feed(raw){
  const m = raw.match(/^(\d{2}:\d{2}:\d{2}) (.*)$/);
  if (!m) return null;
  const ts = at(m[1]), msg = m[2];
  state.last = ts;
  if (state.started == null) state.started = ts;

  let hit;
  if (hit = msg.match(RE.head)){
    state.repo = hit[1]; state.spec = hit[2]; state.base = hit[3];
    return { cls:"evt", ts:m[1], badge:"", text:msg };
  }
  if (hit = msg.match(RE.auth)){ state.auth = hit[1]; return { cls:"", ts:m[1], badge:"", text:msg }; }

  if (hit = msg.match(RE.wrote)){
    state.total = Number(hit[1]);
    hit[2].split(/,\s*/).forEach(x => { const n = x.replace("#",""); if (n) ticket(n); });
    return { cls:"evt", ts:m[1], badge:"", text:msg };
  }

  if (hit = msg.match(RE.round)){
    state.round = Number(hit[1]); state.ready = Number(hit[3]); state.cap = Number(hit[4]);
    hit[2].split(/,\s*/).forEach(x => { const t = ticket(x.replace("#","")); t.chip = "starting"; });
    return { cls:"round", ts:m[1], badge:"", text:"round " + hit[1] + " — " + hit[2] + " · " + hit[3] + " ready, cap " + hit[4] };
  }

  if (hit = msg.match(RE.title)){
    const t = ticket(hit[1]); t.title = hit[2];   // authoritative — beats the slug
    return { cls:"", ts:m[1], badge:"#"+hit[1], text:hit[2] };
  }
  if (hit = msg.match(RE.wt)){
    const t = ticket(hit[1]); t.phase = "worktree"; t.chip = "worktree"; t.start = ts;
    return { cls:"", ts:m[1], badge:"#"+hit[1], text:"worktree cut" };
  }
  if (hit = msg.match(RE.setup)){
    const t = ticket(hit[1]); t.phase = "setup"; t.chip = "setup"; t.setups.push(hit[2]); t.say = hit[2];
    return { cls:"", ts:m[1], badge:"#"+hit[1], text:"setup · " + hit[2] };
  }
  if (hit = msg.match(RE.start)){
    const t = ticket(hit[1]);
    t.phase = "build"; t.chip = "building"; t.branch = hit[2];
    if (!t.title) t.title = titleFromBranch(hit[2]);
    if (t.start == null) t.start = ts;
    return { cls:"evt", ts:m[1], badge:"#"+hit[1], text:"builder started" };
  }
  if (hit = msg.match(RE.say)){
    const t = ticket(hit[1]); t.say = hit[2];
    return { cls:"say", ts:m[1], badge:"#"+hit[1], text:hit[2] };
  }
  if (hit = msg.match(RE.fin)){
    const t = ticket(hit[1]);
    t.took = hit[2];
    t.builderEnd = ts;
    const bad = /limit|error|failed/i.test(hit[3]);
    // Landing is serialised across the round, so a builder that is done is not a ticket
    // that is done — it is queued behind a sibling. A ticking clock and a running pip
    // would both be claiming work that has stopped.
    t.chip = bad ? "failed" : "waiting to land";
    t.waiting = !bad;
    if (bad){ t.say = hit[3]; }
    return { cls:bad?"bad":"evt", ts:m[1], badge:"#"+hit[1], text:"builder finished in " + hit[2] + (bad ? " — " + hit[3] : "") };
  }
  if (hit = msg.match(RE.teard)) return { cls:"", ts:m[1], badge:"#"+hit[1], text:"teardown" };

  if (hit = msg.match(RE.merge)){
    const t = ticket(hit[1]); t.phase = "merge"; t.chip = "merging"; t.waiting = false;
    t.title = t.title || titleFromBranch(hit[2]);
    return { cls:"gate", ts:m[1], badge:"#"+hit[1], text:"merging" };
  }
  if (hit = msg.match(RE.confl)) return { cls:"gate", ts:m[1], badge:"#"+hit[1], text:"conflict resolved — " + hit[2] };

  if (hit = msg.match(RE.gate)){
    const t = ticket(hit[1]); t.phase = "gate"; t.chip = "gate"; t.gate = hit[2]; t.gates.push(hit[2]); t.say = hit[2];
    return { cls:"gate", ts:m[1], badge:"#"+hit[1], text:"gate · " + hit[2] };
  }
  if (hit = msg.match(RE.closed)){
    const t = ticket(hit[1]); t.phase = "done"; t.chip = "closed"; t.result = "closed"; t.end = ts; t.say = "";
    state.closed++;
    return { cls:"ok", ts:m[1], badge:"#"+hit[1], text:"closed" };
  }
  if (hit = msg.match(RE.back)){
    const t = ticket(hit[1]); t.phase = "done"; t.chip = "handed back"; t.result = "failed"; t.end = ts; t.say = hit[2];
    state.back++;
    return { cls:"bad", ts:m[1], badge:"#"+hit[1], text:"handed back — " + hit[2] };
  }
  if (hit = msg.match(RE.blocked)){
    const t = ticket(hit[1]); t.title = t.title || hit[2]; if (!t.result) t.chip = "blocked";
    return { cls:"", ts:m[1], badge:"#"+hit[1], text:"blocked — " + hit[2] };
  }

  if (hit = msg.match(RE.pr)){ state.pr = hit[2]; state.prVerb = hit[1]; return { cls:"evt", ts:m[1], badge:"", text:msg }; }
  if (hit = msg.match(RE.merged)){ state.merged = true; return { cls:"ok", ts:m[1], badge:"", text:msg }; }

  if (hit = msg.match(RE.summary)){
    const k = hit[1], v = hit[2];
    if (k === "stop condition"){ state.stop = v; state.finished = true; }
    if (k === "merged") state.merged = !/^no/.test(v);
    if (k === "pull request") state.pr = v.replace("#","");
    return { cls:"evt", ts:m[1], badge:"", text:msg };
  }

  return { cls:"", ts:m[1], badge:"", text:msg };
}

/* ── Render ──────────────────────────────────────────────────────────── */
const cardEls = new Map();

function phaseIndex(t){
  if (t.result) return PHASES.length;
  return t.phase ? PHASES.indexOf(t.phase) : -1;
}

function render(){
  const now = state.finished ? (state.last ?? Date.now()) : Date.now();

  $("ident").innerHTML = state.repo
    ? "<b>"+state.repo+"</b><span class='sep'>/</span>spec <b>#"+state.spec+"</b><span class='sep'>/</span>base <b>"+state.base+"</b>"
    : "waiting for a run";

  const flight = [...state.tickets.values()].filter(t => !t.result && t.phase && t.phase !== "done").length;
  const dot = $("dot"), phase = $("phase");
  dot.className = "dot" + (state.finished ? (state.merged ? " done" : (state.back ? " fail" : " done")) : (flight ? " on" : ""));
  phase.textContent = state.finished ? (state.stop ?? "finished") : (flight ? "building" : (state.repo ? "waiting" : "idle"));

  $("clock").textContent = state.started ? dur(now - state.started) : "--:--";
  $("cap").textContent = state.cap ? ("cap " + state.cap) : "";

  const set = (id, v, dimZero) => {
    const el = $(id); el.textContent = v;
    el.classList.toggle("zero", dimZero && !v);
  };
  set("t-round", state.round, true);
  set("t-flight", flight, true);
  set("t-closed", state.closed, true);
  set("t-back", state.back, true);
  set("t-total", state.total || state.tickets.size, true);

  const wrap = $("cards");
  if (state.order.length) { const e = $("empty"); if (e) e.remove(); }

  for (const n of state.order){
    const t = state.tickets.get(n);
    let el = cardEls.get(n);
    if (!el){
      el = document.createElement("div");
      el.innerHTML =
        '<div class="row1"><span class="num"></span><span class="title"></span><span class="chip"></span><span class="elapsed"></span></div>'+
        '<div class="say"></div>'+
        '<div class="phases"></div>'+
        '<div class="phlabels">'+PHASES.map(p=>"<span>"+p+"</span>").join("")+"</div>";
      el.className = "card enter";
      el.addEventListener("animationend", () => el.classList.remove("enter"), { once: true });
      cardEls.set(n, el);
      wrap.appendChild(el);
    }
    const kind = t.result === "closed" ? "closed" : t.result === "failed" ? "failed"
               : (t.phase === "merge" || t.phase === "gate") ? "landing"
               : t.waiting ? "landing"
               : t.phase ? "working" : "";
    // Toggled, never reassigned wholesale: rewriting className restarts every animation
    // on the element, and this runs once a second.
    for (const k of ["working","landing","closed","failed"]) el.classList.toggle(k, k === kind);
    el.querySelector(".num").textContent = "#" + t.n;
    el.querySelector(".title").textContent = t.title || "—";
    el.querySelector(".chip").textContent = t.chip;

    const e = el.querySelector(".elapsed");
    const stop = t.end ?? (t.waiting ? t.builderEnd : null);
    e.textContent = t.start == null ? "" : dur((stop ?? now) - t.start);

    const say = el.querySelector(".say");
    say.innerHTML = t.say ? "" : "<em>—</em>";
    if (t.say) say.textContent = t.say;

    const idx = phaseIndex(t);
    const ph = el.querySelector(".phases");
    if (ph.children.length !== PHASES.length){
      ph.innerHTML = PHASES.map(()=>'<span class="ph"></span>').join("");
    }
    const at = t.waiting ? idx + 1 : idx;          // build is finished; nothing is running
    [...ph.children].forEach((c,i) => {
      c.className = "ph"
        + (i < at ? " done" + (t.result === "closed" ? " ok" : "") : "")
        + (i === at && !t.result && !t.waiting ? " now" + (t.phase === "merge" || t.phase === "gate" ? " land" : "") : "")
        + (t.result === "closed" ? " done ok" : "");
    });
  }

  // Cards ordered so what is happening is at the top and what is finished settles below.
  const rank = (t) => t.result ? 2 : (t.phase ? 0 : 1);
  const wanted = [...state.order]
    .map(n => state.tickets.get(n))
    .sort((a,b) => rank(a) - rank(b) || Number(a.n) - Number(b.n))
    .map(t => cardEls.get(t.n));

  const same = wanted.length === wrap.children.length
    && wanted.every((el, i) => wrap.children[i] === el);
  if (!same) for (const el of wanted) wrap.appendChild(el);

  const out = $("outcome");
  if (state.finished){
    const good = state.stop === "done" && !state.back;
    out.className = "outcome show " + (good ? "good" : "poor");
    out.innerHTML =
      "<h2>" + (state.merged ? "Merged." : good ? "Done, not merged." : "Stopped on " + state.stop + ".") + "</h2>" +
      "<p>" + state.closed + " closed · " + state.back + " handed back · " +
      (state.total || state.tickets.size) + " tickets · " + dur((state.last ?? 0) - (state.started ?? 0)) + " end to end</p>" +
      (state.pr ? "<div class='pr'>pull request <b>#" + state.pr + "</b></div>" : "");
  }
}

/* ── Stream ──────────────────────────────────────────────────────────── */
const lines = $("lines"), scroller = $("streamScroll");
const MAX_LINES = 700;

function push(ev){
  if (!ev) return;
  const el = document.createElement("div");
  el.className = "ln " + (ev.cls || "");
  const t = document.createElement("span"); t.className = "t"; t.textContent = ev.ts;
  const b = document.createElement("span"); b.className = "b"; b.textContent = ev.badge;
  const m = document.createElement("span"); m.className = "m"; m.textContent = ev.text;
  el.append(t,b,m);
  lines.appendChild(el);
  while (lines.children.length > MAX_LINES) lines.removeChild(lines.firstChild);
}

var pinned = true;
scroller.addEventListener("scroll", () => {
  pinned = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 40;
});

/* ── Wire ────────────────────────────────────────────────────────────── */
/* The log is emptied at the start of every run, so the server says so and this throws the
   last run away. Without it a page left open across two runs shows both at once. */
function reset(){
  for (const k of ["repo","spec","base","auth","cap","ready","pr","prVerb","merged","stop","started","last"]) state[k] = null;
  state.round = 0; state.closed = 0; state.back = 0; state.total = 0; state.finished = false;
  state.tickets.clear(); state.order.length = 0;
  cardEls.clear();
  $("cards").innerHTML = "";
  lines.innerHTML = "";
  $("outcome").className = "outcome";
  pinned = true;
}

const es = new EventSource("/events");
es.addEventListener("reset", () => { reset(); render(); });
es.addEventListener("lines", (e) => {
  for (const raw of e.data.split("\n")) push(feed(raw));
  render();
  if (pinned) scroller.scrollTop = scroller.scrollHeight;
});
es.onerror = () => { $("phase").textContent = "reconnecting"; };

setInterval(render, 1000);
render();
</script>
</body>
</html>
